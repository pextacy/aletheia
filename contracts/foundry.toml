[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Deploy script writes the deployed address to ../deployments/<chainId>.json
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[lint]
# uint64(block.timestamp) casts are deliberate: uint64 outlives the sun.
exclude_lints = ["unsafe-typecast"]

[fuzz]
runs = 256
