name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: Contracts (forge test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge --version
      - run: forge build
      - run: forge test -vvv

  bridge:
    name: Bridge (typecheck + tests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  cli:
    name: CLI (typecheck + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      # Build-time placeholders; real values are set in the Vercel project.
      CHAIN_ID: "10143"
      RPC_URL: https://testnet-rpc.monad.xyz
      EXPLORER_URL: https://testnet.monadexplorer.com
      REGISTRY_ADDRESS: "0x0000000000000000000000000000000000000001"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
