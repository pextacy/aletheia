# Render blueprint for the Aletheia bridge. Deploy via "New → Blueprint" on the
# dashboard, or let the API create the service from this spec.
#
# Secrets (sync: false) are set in the Render dashboard/API, never in git:
#   ATTESTOR_PRIVATE_KEY, GITHUB_WEBHOOK_SECRET, GITHUB_TOKEN, DATABASE_URL.
# PORT is injected by Render; the bridge binds to it automatically.
#
# The free plan spins down after ~15 min idle and a cold start exceeds GitHub's
# 10 s webhook timeout, so .github/workflows/keepalive.yml pings /healthz every
# 10 minutes to keep the service warm.
services:
  - type: web
    name: aletheia-bridge
    runtime: docker
    repo: https://github.com/pextacy/aletheia
    branch: main
    rootDir: bridge
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CHAIN_ID
        value: "10143"
      - key: RPC_URL
        value: https://monad-testnet.gateway.tenderly.co
      - key: REGISTRY_ADDRESS
        value: "0x80eDe1D4EEc7572F0a1c28e0A70bC4E4f06F1116"
      - key: ATTESTOR_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
